name: Verificar biblioteca
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integracion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Acortar los intervalos de los temporizadores en el entorno de prueba
        run: |
          sed -i 's/hour="\*",minute="\*\/15"/hour="*",minute="*",second="*\/5"/' src/main/java/pe/edu/xyz/Avisos.java
          sed -i 's/hour="6",minute="0"/hour="*",minute="*",second="*\/5"/' src/main/java/pe/edu/xyz/Reportes.java
      - name: Compilar y desplegar
        run: docker compose up -d --build
      - name: Verificar flujos
        run: python3 pruebas/integracion.py
      - name: Diagnóstico de despliegue
        if: failure()
        run: docker compose logs web
